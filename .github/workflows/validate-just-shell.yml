name: Validate Just and Shell

on:
  pull_request:
    paths:
      - "Justfile"
      - "just/*"
      - "**.sh"
  push:
    branches:
      - main
    paths:
      - "Justfile"
      - "just/*"
      - "**.sh"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install just shellcheck shfmt
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install just shellcheck shfmt
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Check Just Syntax
        shell: bash
        run: |
          just lint::just-check

      - name: Check Shell Syntax
        shell: bash
        run: |
          just lint::shfmt-check
          just lint::shellcheck
